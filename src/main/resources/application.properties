spring.application.name=software-factory
server.port=8080

# =====================================================================
# Target repository / GitHub access
# Token is never stored here ? it is read from the GITHUB_TOKEN environment
# variable at startup (see plan.md section 6). Set it before running, e.g.:
#   $env:GITHUB_TOKEN = "ghp_..."   (PowerShell)
# =====================================================================
factory.github.api-base-url=https://api.github.com
factory.github.repo-url=https://github.com/FlutterInt/fips-martech-conversion-router
factory.github.token=${GITHUB_TOKEN}
factory.github.owner=FlutterInt
factory.github.target-app=fips-martech-conversion-router

# IMPORTANT: GitHub reports default_branch=master, but 'develop' is the real trunk.
factory.github.base-branch=develop
factory.github.branch-prefix=factory/sec/
factory.github.default-commit-limit=5
factory.github.connect-timeout-ms=10000
factory.github.read-timeout-ms=30000

# Print the last N commits on the base branch at startup
factory.startup.probe-enabled=true

# =====================================================================
# Actuator
# =====================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# =====================================================================
# Swagger / OpenAPI (springdoc)
# UI:   http://localhost:8080/swagger-ui.html
# JSON: http://localhost:8080/v3/api-docs
# =====================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.flutterint.softwarefactory.web

